name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for frontend tests
        run: npx --no-install playwright install --with-deps chromium

      - name: Run frontend checks
        working-directory: manager/frontend
        run: npm run check:ci

      - name: Upload embedded frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: manager/frontend/dist/
          if-no-files-found: error

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache: true

      - name: Download embedded frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: manager/frontend/dist/

      - name: Run Go tests
        working-directory: manager
        run: go test ./...

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: |
            go.work.sum
            manager/go.sum

      - name: Install the Wails CLI matching the app
        working-directory: manager
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0 -or !$version) { throw 'Unable to resolve the Wails version' }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the desktop executable
        working-directory: manager
        run: |
          $wails = Join-Path (go env GOPATH) 'bin/wails.exe'
          & $wails build
          exit $LASTEXITCODE

      - name: Run Go tests on Windows
        working-directory: manager
        run: go test ./...

      - name: Upload the Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: reassembly-windows
          path: manager/build/bin/wails-app.exe
          if-no-files-found: error
