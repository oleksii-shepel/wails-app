name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for frontend tests
        run: npx --no-install playwright install --with-deps chromium

      - name: Run frontend checks
        working-directory: manager/frontend
        run: npm run check:ci

      - name: Upload embedded frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: manager/frontend/dist/
          if-no-files-found: error

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache: true

      - name: Download embedded frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: manager/frontend/dist/

      - name: Run Go tests
        working-directory: manager
        run: go test ./...
