<div class="panes-container">

  <app-file-pane
    paneId="left"
    [workspace]="activeWorkspace"
    [showHidden]="showHidden"
    (copyToOther)="copyToOtherPane(leftPane, rightPane)"
    (moveToOther)="moveToOtherPane(leftPane, rightPane)">
  </app-file-pane>

  <app-file-pane
    paneId="right"
    [workspace]="activeWorkspace"
    [showHidden]="showHidden"
    (copyToOther)="copyToOtherPane(rightPane, leftPane)"
    (moveToOther)="moveToOtherPane(rightPane, leftPane)">
  </app-file-pane>

</div>
