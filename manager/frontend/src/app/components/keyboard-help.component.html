<div
  class="shortcut-reference-backdrop backdrop dialog-group"
  *ngIf="renderVisible"
  [class.dialog-group--closing]="isClosing"
  (click)="hide()"
  (animationend)="onBackdropAnimationEnd($event)">
  <section
    #dialogPanel
    class="shortcut-reference dialog-surface"
    role="dialog"
    aria-modal="true"
    aria-label="Keyboard shortcuts"
    tabindex="-1"
    (click)="$event.stopPropagation()" (keydown.escape)="hide(); $event.preventDefault(); $event.stopPropagation()">

    <header class="reference-header">
      <div>
        <h2>Keyboard shortcuts</h2>
        <p>Context-aware shortcuts, with the current surface first.</p>
      </div>

      <div class="reference-header-actions">
        <button type="button" class="dialog-close" (click)="hide()" aria-label="Close dialog" title="Close"> × </button>
      </div>
    </header>

    <div class="search-bar">
      <input
        #searchInput
        data-dialog-initial-focus
        type="text"
        [(ngModel)]="searchText"
        (ngModelChange)="onSearchChange()"
        aria-label="Search keyboard shortcuts" placeholder="Search shortcuts..."
        class="search-input"
        autofocus
      />
      <button *ngIf="searchText" type="button" class="clear-button" (click)="clearSearch()" title="Clear search" aria-label="Clear shortcut search">×</button>
    </div>

    <div class="reference-body">
      <div *ngIf="!hasSearchResults" class="no-results">
        No shortcuts found for "{{ searchText }}"
      </div>

      <section *ngFor="let section of filteredSections" class="shortcut-section">
        <header class="shortcut-section-header" *ngIf="section.categories.length > 0">
          <h3>{{ section.title }}</h3>
          <p>{{ section.subtitle }}</p>
        </header>

        <section *ngFor="let category of section.categories" class="shortcut-category">
          <h4>{{ category.name }}</h4>

          <div class="shortcut-list">
            <div *ngFor="let binding of category.bindings" class="shortcut-row">
              <div class="shortcut-keys">
                <ng-container *ngFor="let step of bindingKeySteps(binding); let stepIndex = index">
                  <span class="key-step">
                    <ng-container *ngFor="let key of step; let keyIndex = index">
                      <kbd>{{ key }}</kbd>
                      <span *ngIf="keyIndex < step.length - 1" class="plus">+</span>
                    </ng-container>
                  </span>
                  <span *ngIf="stepIndex < bindingKeySteps(binding).length - 1" class="then">then</span>
                </ng-container>
              </div>

              <div class="shortcut-description">{{ binding.description }}</div>
            </div>
          </div>
        </section>
      </section>
    </div>

    <footer class="reference-footer">
      <span>Live bindings only</span>
      <span><kbd>Esc</kbd> to close</span>
    </footer>
  </section>
</div>
